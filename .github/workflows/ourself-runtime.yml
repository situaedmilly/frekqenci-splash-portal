name: OURSELF Runtime Reality Gate
on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'ourselfd/**'
      - 'selfgraph/**'
      - '.github/workflows/ourself-runtime.yml'
      - '.github/agents/ourselftelligence.agent.md'
permissions:
  contents: read
jobs:
  reality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MCP installation and protocol
        run: |
          set -euo pipefail
          for d in ourself-context ourself-graphs ourself-evidence ourself-github; do
            test -f "mcp/$d/dist/index.js"
            out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | OURSELF_MCP_NAME="$d" node "mcp/$d/dist/index.js")
            echo "$out"
            echo "$out" | grep -q '"jsonrpc":"2.0"'
            echo "$out" | grep -q '"tools"'
          done
      - name: OURSELFD activation and runtime execution
        run: |
          set -euo pipefail
          node ourselfd/index.js &
          pid=$!
          sleep 1
          test -f .ourself/runtime/ourselfd-state.json
          node -e "const j=require('./.ourself/runtime/ourselfd-state.json'); console.log(JSON.stringify(j)); if(j.status!=='ACTIVE') process.exit(1)"
          kill "$pid"
          wait "$pid" || true
          node -e "const j=require('./.ourself/runtime/ourselfd-state.json'); if(j.status!=='STOPPED') process.exit(1)"
      - name: SELFGRAPH admission
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const g=JSON.parse(fs.readFileSync('selfgraph/registry.json','utf8'));
          const required=['reality','repository','agent','mcp','ourselfd','actimanirun','evidence','receipt'];
          if(!required.every(x=>g.nodes.includes(x))) process.exit(1);
          console.log(JSON.stringify({graph_id:g.graph_id,status:'ADMITTED',basis:'MCP+OURSELFD runtime verification on GitHub Actions'}));
          NODE
